services:
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_TZ: ${APP_TZ:-Asia/Kolkata}
      SQLITE_PATH: /data/demo.db
      MEMORY_DIR: /data/memory
      CHAT_MODEL: ${CHAT_MODEL:-xai/grok-4.6}
      XAI_API_KEY: ${XAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      IMAGE_GEN_URL: ${IMAGE_GEN_URL:-}
      IMAGE_GEN_KEY: ${IMAGE_GEN_KEY:-}
      IMAGE_GEN_MODE: ${IMAGE_GEN_MODE:-imagine}
      IMAGE_GEN_MODEL: ${IMAGE_GEN_MODEL:-grok-imagine-image}
      IMAGE_BUDGET_USD: ${IMAGE_BUDGET_USD:-2.00}
      VIDEO_GEN_MODE: ${VIDEO_GEN_MODE:-imagine}
      VIDEO_GEN_MODEL: ${VIDEO_GEN_MODEL:-grok-imagine-video-1.5}
      VIDEO_BUDGET_USD: ${VIDEO_BUDGET_USD:-2.00}
      LOG_PATH: /data/logs/machine.jsonl
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../data:/data

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /engine
        ENGINE_URL: http://api:8000
    ports:
      - "3050:3000"
    environment:
      NEXT_PUBLIC_API_URL: /engine
      ENGINE_URL: http://api:8000
      LOG_PATH: /data/logs/machine.jsonl
    depends_on:
      - api
