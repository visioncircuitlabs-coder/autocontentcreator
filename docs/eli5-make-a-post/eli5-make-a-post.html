<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Make a post</title>
  <style>
    :root {
      --ink: #14110e;
      --ticket: #f4efe4;
      --mute: #cfc6b4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--ink);
      color: var(--ticket);
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    }
    .beat {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: 1fr auto;
    }
    .beat img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .beat p {
      padding: 18px 20px 28px;
      font-size: clamp(1.25rem, 3.2vw, 1.85rem);
      line-height: 1.25;
      letter-spacing: -0.02em;
      font-family: "Fraunces", "Times New Roman", serif;
      font-weight: 500;
    }
    @media (min-width: 900px) {
      .beat {
        grid-template-rows: none;
        grid-template-columns: 1.6fr 0.9fr;
        align-items: stretch;
      }
      .beat p {
        display: grid;
        align-content: center;
        padding: 40px;
        max-width: 18ch;
      }
    }
  </style>
</head>
<body>
  <section class="beat">
    <img src="beat-1.jpg" alt="A finger pressing a brass desk button beside a blue gel jar." />
    <p>You tap Make a post.</p>
  </section>
  <section class="beat">
    <img src="beat-2.jpg" alt="A news page clipped to a short handwritten assignment beside the jar." />
    <p>It writes the assignment.</p>
  </section>
  <section class="beat">
    <img src="beat-3.jpg" alt="Three photos of the same jar in different rooms." />
    <p>It tries a few angles.</p>
  </section>
  <section class="beat">
    <img src="beat-4.jpg" alt="A hand writing a short caption on a cream card." />
    <p>It writes the caption.</p>
  </section>
  <section class="beat">
    <img src="beat-5.jpg" alt="A second pair of hands checking the card with a stamp." />
    <p>A second pass checks it.</p>
  </section>
  <section class="beat">
    <img src="beat-6.jpg" alt="A camera on a tripod photographing the jar by a rainy night window." />
    <p>It makes the picture.</p>
  </section>
  <section class="beat">
    <img src="beat-7.jpg" alt="A sealed envelope and a face-down phone on the desk." />
    <p>It waits. Nothing goes live.</p>
  </section>
</body>
</html>
